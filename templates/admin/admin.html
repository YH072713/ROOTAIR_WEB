<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin/admin.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR&display=swap" rel="stylesheet">
    <script src="{{ url_for('static', filename='js/admin/admin.js') }}" defer></script>
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script> 
    <style>
        /* ✅ Flash 메시지 스타일 (폼 중앙에 정렬) */
        .flash-messages {
            width: 100%;
            max-width: 400px;  /* 로그인 폼 크기에 맞춤 */
            text-align: center;
            margin: 0 auto 15px;  /* 중앙 정렬 */
            display: flex;
            justify-content: center; /* 수평 정렬 */
            align-items: center; /* 수직 정렬 */
            flex-direction: column; /* 요소들을 수직 정렬 */
        }
        .flash-message {
            padding: 10px;
            font-size: 16px;
            color: white;
            border-radius: 5px;
            width: 100%;
        }
        .flash-message.danger { background-color: #ff4d4d; } /* ❌ 실패 메시지 (빨간색) */
        .flash-message.success { background-color: #4CAF50; } /* ✅ 성공 메시지 (초록색) */
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar_logo">
            <a href="{{ url_for('main.main') }}">
                <img src="{{ url_for('static', filename='images/rootair.jpg') }}"/>
            </a>
        </div>
        <ul class="navbar_menu">
            <li><a href="{{ url_for('main.main') }}">예약</a></li>
            <li><a href="{{ url_for('notices.notices_page') }}">공지사항</a></li>
            <li><a href="{{ url_for('qna.qna_page') }}">문의사항</a></li>
        </ul>
        <ul class="navbar_member">
            <li class="navbar_signup"><a href="{{ url_for('member.signup') }}">회원가입</a></li>
            <li class="navbar_login"><a href="{{ url_for('member.login') }}">로그인</a></li>
        </ul>
        <img class="navbar_togglebtn" src="{{ url_for('static', filename='images/topbar.jpg') }}" width="24" height="18"/>
    </nav>
</body>

<body>
    <div class="login_page_wrapper">
        <header id="LoginType" class="login_wrap"></header>
        <div class="login-page">
            <h2>관리자용</h2>
            <div class="login-input">
                <form method="post" action="{{ url_for('admin.admin_login') }}" id="login-form">
                    
                    <!-- ✅ Flash 메시지를 로그인 폼 내부로 이동 -->
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            <div class="flash-messages">
                                {% for category, message in messages %}
                                    <div class="flash-message {{ category }}">{{ message }}</div>
                                {% endfor %}
                            </div>
                        {% endif %}
                    {% endwith %}

                    <div class="userID">
                        <input type="text" name="userID" placeholder="아이디" required>
                    </div>
                    <div class="password">
                        <input type="password" name="password" placeholder="비밀번호" required>
                    </div>
                    <div class="logininput">
                        <button type="submit">로그인</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
